; Car-Display: Freenove ESP32-S3 Display 2.8" (FNK0104B, ILI9341 IPS 240x320, FT6336U Touch)
;              + BLE-OBD-Adapter (ELM327 kompatibel)
;
; Bauen & flashen:   pio run -e freenove -t upload
; Serieller Monitor: pio device monitor
; Ohne Auto testen:  pio run -e simulator -t upload

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Modul ESP32-S3 mit 16 MB Flash und 8 MB OPI-PSRAM (N16R8)
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
lib_deps =
    powerbroker2/ELMDuino@^3.4.1
    h2zero/NimBLE-Arduino@^1.4.3
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serieller Monitor über die USB-C-Buchse ("USB CDC On Boot")
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI-Konfiguration aus Freenove "FNK0104AB_2.8_240x320_ILI9341.h" ---
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

[env:freenove]

[env:simulator]
; Erzeugt Fake-Werte statt Bluetooth – zum Testen von Display und Diagrammen am Schreibtisch
build_flags =
    ${env.build_flags}
    -DSIMULATE_OBD=1
