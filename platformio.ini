; Car-Display Firmware v2
; Board: Freenove ESP32-S3 Display 2,8" (FNK0104B), BLE-OBD-Adapter Vgate vLinker MC+
;
; Bauen:            pio run -e freenove
; Flashen:          pio run -e freenove -t upload
; Simulator:        pio run -e simulator -t upload
; Unit-Tests (PC):  pio test -e native
; Serieller Monitor: pio device monitor

[platformio]
default_envs = freenove

; Gemeinsame Einstellungen beider ESP32-Umgebungen
[esp32_base]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; ESP32-S3 mit 8 MB OPI-PSRAM im Chip, 16 MB Quad-Flash (esptool: Hersteller 0x5E, Gerät 0x4018).
; Flash im DIO-Modus: Mit QIO startete Jos Board in einer Neustart-Schleife, vermutlich kann der
; Bootloader bei diesem Flash-Chip den QIO-Modus nicht richtig einschalten. DIO ist kaum langsamer.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
    ; ANNAHME: LVGL fest auf 9.2.x, weil gegen genau diese Version geprüft (^9.2.0 würde auch 9.3+ holen)
    lvgl/lvgl@~9.2.2
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.0.0
    mikalhart/TinyGPSPlus@^1.0.3
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; Serieller Monitor über die USB-C-Buchse ("USB CDC On Boot")
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Board-Beschreibung (Pins, TFT_eSPI-Setup) in jede Datei einbinden, auch in TFT_eSPI.
    ; Ein anderes Board braucht nur eine andere Datei an dieser Stelle.
    -Iinclude
    -include include/board_fnk0104b.h
    ; LVGL findet lv_conf.h in include/, die Schriften finden lvgl.h
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Isrc
; Der Hardwaretest in src/hwtest/ gehört nicht zur Firmware
build_src_filter = +<*> -<hwtest/>

[env:freenove]
extends = esp32_base

[env:simulator]
; Ersetzt Bluetooth und OBD durch eine simulierte Fahrt (Display ohne Auto prüfen)
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DSIMULATE_OBD=1

[env:hwtest]
; Nur zur Fehlersuche: Licht blinkt, Monitor schreibt "lebt ...". Gleiche Board-Einstellungen wie die Firmware.
extends = esp32_base
build_src_filter = -<*> +<hwtest/>
lib_deps =

[env:simulator_langsam]
; Nur zur Fehlersuche: Simulator mit Flash-Takt 40 statt 80 MHz
extends = env:simulator
board_build.f_flash = 40000000L
; Arduino liefert keinen fertigen 40-MHz-Bootloader. Daher den 80-MHz-Bootloader nehmen; sein Kopf wird beim
; Bauen und Flashen auf 40 MHz gesetzt, und daran hält sich der Bootloader.
board_build.f_boot = 80000000L

[env:hwtest_gross]
; Nur zur Fehlersuche: hwtest, aber so groß wie die Firmware (700 kB Polster), Flash-Takt 80 MHz
extends = env:hwtest
build_flags =
    ${esp32_base.build_flags}
    -DHWTEST_PAD_KB=700

[env:hwtest_ohne_psram]
; Nur zur Fehlersuche: wie hwtest, aber ohne PSRAM. Läuft nur dieser, liegt es an der PSRAM-Einstellung.
extends = esp32_base
board_build.arduino.memory_type = dio_qspi
build_src_filter = -<*> +<hwtest/>
lib_deps =
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -include include/board_fnk0104b.h

[env:hwtest_standard]
; Nur zur Fehlersuche: wie hwtest, aber mit den Standard-Einstellungen des Boards
; (keine eigene Partitionstabelle, keine Flash-Größe, kein PSRAM, kein Board-Header).
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<hwtest/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_PIN_LCD_BL=45
    -DBOARD_LCD_BL_ON_HIGH=1

[env:hwtest_psram]
; Nur zur Fehlersuche: Standard plus PSRAM-Einstellung der Firmware
extends = env:hwtest_standard
board_build.arduino.memory_type = dio_opi
build_flags =
    ${env:hwtest_standard.build_flags}
    -DBOARD_HAS_PSRAM

[env:hwtest_partitionen]
; Nur zur Fehlersuche: Standard plus Flash-Größe, Flash-Modus und Partitionstabelle der Firmware
extends = env:hwtest_standard
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = partitions.csv

[env:native]
; Unit-Tests der Rechenmodule auf dem PC (Unity, ohne Arduino). Braucht einen C++-Compiler (gcc/g++).
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<util/> +<calc/> +<sim/> -<sim/sim_task.cpp> +<obd/elm_parser.cpp> +<obd/pid_scheduler.cpp> +<storage/profile_match.cpp> +<storage/profile_json.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -std=gnu++17
    -Iinclude
    -Isrc
    -Wall
    -Wextra
