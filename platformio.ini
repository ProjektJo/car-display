; Car-Display Firmware v2
; Board: Freenove ESP32-S3 Display 2,8" (FNK0104B), BLE-OBD-Adapter Vgate vLinker MC+
;
; Bauen:            pio run -e freenove
; Flashen:          pio run -e freenove -t upload
; Simulator:        pio run -e simulator -t upload
; Unit-Tests (PC):  pio test -e native
; Serieller Monitor: pio device monitor

[platformio]
default_envs = freenove

; Gemeinsame Einstellungen beider ESP32-Umgebungen
[esp32_base]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; ESP32-S3 mit 8 MB OPI-PSRAM im Chip, 16 MB Quad-Flash (esptool: Hersteller 0x5E, Gerät 0x4018).
; Flash im DIO-Modus: Mit QIO startete Jos Board in einer Neustart-Schleife, vermutlich kann der
; Bootloader bei diesem Flash-Chip den QIO-Modus nicht richtig einschalten. DIO ist kaum langsamer.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
    ; ANNAHME: LVGL fest auf 9.2.x, weil gegen genau diese Version geprüft (^9.2.0 würde auch 9.3+ holen)
    lvgl/lvgl@~9.2.2
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.0.0
    mikalhart/TinyGPSPlus@^1.0.3
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; Serieller Monitor über die USB-C-Buchse ("USB CDC On Boot")
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Board-Beschreibung (Pins, TFT_eSPI-Setup) in jede Datei einbinden, auch in TFT_eSPI.
    ; Ein anderes Board braucht nur eine andere Datei an dieser Stelle.
    -Iinclude
    -include include/board_fnk0104b.h
    ; LVGL findet lv_conf.h in include/, die Schriften finden lvgl.h
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Isrc

[env:freenove]
extends = esp32_base

[env:simulator]
; Ersetzt Bluetooth und OBD durch eine simulierte Fahrt (Display ohne Auto prüfen)
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DSIMULATE_OBD=1

[env:native]
; Unit-Tests der Rechenmodule auf dem PC (Unity, ohne Arduino). Braucht einen C++-Compiler (gcc/g++).
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<util/> +<calc/> +<sim/> -<sim/sim_task.cpp> +<obd/elm_parser.cpp> +<obd/pid_scheduler.cpp> +<storage/profile_match.cpp> +<storage/profile_json.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -std=gnu++17
    -Iinclude
    -Isrc
    -Wall
    -Wextra

[env:board_test]
; Unit-Tests auf dem Board statt auf dem PC, wenn kein g++ installiert ist: pio test -e board_test
; Gleiche Rechenmodule wie "native", dazu Arduino; jede Testgruppe wird einzeln geflasht.
extends = esp32_base
test_framework = unity
test_build_src = yes
build_src_filter = ${env:native.build_src_filter}
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
